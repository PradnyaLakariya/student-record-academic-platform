---
- name: Create application directory on the server
  ansible.builtin.file:
    path: /opt/student-platform
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy application source and Dockerfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/"
    dest: /opt/student-platform/
    owner: root
    group: root
    mode: preserve

- name: Build application image
  community.docker.docker_image:
    name: student-record-api
    tag: latest
    source: build
    build:
      path: /opt/student-platform
    force_source: true

- name: Run the application container
  community.docker.docker_container:
    name: student-record-api
    image: student-record-api:latest
    state: started
    restart_policy: always
    published_ports:
      - "127.0.0.1:8080:8080"
